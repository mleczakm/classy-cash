framework:
    http_client:
        default_options:
            # Bound how long an outbound call (mailer transport, Gmail IMAP-adjacent
            # HTTP calls, etc.) can block. Mailer/notifier messages are routed to the
            # 'sync' transport (see messenger.yaml), so sending an email happens
            # inline inside whatever Doctrine transaction wraps the current handler.
            # Without a ceiling here, a slow or hanging third-party endpoint keeps
            # that transaction open until Postgres kills the idle connection with
            # "idle-in-transaction timeout" — ported from kiddo's fix for the same
            # architecture (2dbc7ac).
            timeout: 5
            max_duration: 15
