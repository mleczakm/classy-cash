# see https://symfony.com/doc/current/reference/configuration/framework.html
framework:
    secret: '%env(APP_SECRET)%'

    # Note that the session will be started ONLY if you read or write from it.
    session:
        # Native PHP session state is process-global and unsafe when requests run in
        # concurrent Swoole coroutines. Keep request state in the coroutine-local table and
        # delegate persistence to the PDO handler below.
        storage_factory_id: swoole_bundle.session.table_storage_factory
        handler_id: Symfony\Component\HttpFoundation\Session\Storage\Handler\PdoSessionHandler

    #esi: true
    #fragments: true
    trusted_headers: ['x-forwarded-for', 'x-forwarded-host', 'x-forwarded-proto', 'x-forwarded-port', 'x-forwarded-prefix']
    trusted_proxies: 2400:cb00::/32,2606:4700::/32,2803:f800::/32,2405:b500::/32,2405:8100::/32,2a06:98c0::/29,2c0f:f248::/32
when@test:
    framework:
        test: true
        session:
            handler_id: ~
            storage_factory_id: session.storage.factory.mock_file
