swoole_bundle_scheduler:
    enabled: true
    interval: 1

    pre_run: 'App\Infrastructure\Doctrine\SchedulerConnectionGuard'

    lock:
        enabled: true
        factory: lock.factory
        resource: app-scheduler-tick

    watchdog:
        enabled: true
        timeout: '%env(int:SCHEDULER_TICK_TIMEOUT_SECONDS)%'

    heartbeat:
        enabled: true
        cache: cache.app

    health_check:
        enabled: true
        max_silence: '%env(int:HEALTHCHECK_SCHEDULER_MAX_SILENCE_SECONDS)%'
