# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:
  env(HTTP_CLIENT_HEALTHCHECK_URL): 'https://connectivitycheck.gstatic.com/generate_204'
  env(HEALTHCHECK_MAX_PROCESSES): '20'
  env(HEALTHCHECK_MAX_RSS_MIB): '1536'
  env(SCHEDULER_TICK_TIMEOUT_SECONDS): '15'
  env(HEALTHCHECK_SCHEDULER_MAX_SILENCE_SECONDS): '90'

services:
  # default configuration for services in *this* file
  _defaults:
    autowire: true      # Automatically injects dependencies in your services.
    autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.
    bind:
      $appVersion: '%env(APP_VERSION)%'
      $isFetchingEmailsEnabled: '@=env("MAILBOX_USERNAME") and env("MAILBOX_PASSWORD")'

  # makes classes in src/ available to be used as services
  # this creates a service per class whose id is the fully-qualified class name
  App\:
    resource: '../src/'
    exclude:
      - '../src/DependencyInjection/'
      - '../src/Entity/'
      - '../src/Kernel.php'

  App\Application\Service\WebmailUrlService:
    arguments:
      $appEnv: '%env(APP_ENV)%'

  # add more service definitions when explicit configuration is needed
  # please note that last definitions always *replace* previous ones

  App\Application\CommandHandler\:
    resource: '../src/Application/CommandHandler/'
    tags: [ 'messenger.message_handler' ]

  App\Application\CommandHandler\IncomingNotificationMailQueryWithLastImportDateUpdate:
    decorates: App\Infrastructure\ImapEngine\AliorNotificationMailProvider
    arguments:
      $inner: '@.inner'

  App\Application\Service\IncomingNotificationMailQuery: '@App\Application\CommandHandler\IncomingNotificationMailQueryWithLastImportDateUpdate'

  App\Application\CommandHandler\SendLoginNotificationHandler:
    arguments:
      $loginLinkHandler: '@security.authenticator.login_link_handler.main'
    tags: [ 'messenger.message_handler' ]

  dunglas_doctrine_json_odm.serializer:
    class: Dunglas\DoctrineJsonOdm\Serializer
    arguments:
      - [ '@App\Infrastructure\Symfony\Serializer\MoneyNormalizer', '@?dunglas_doctrine_json_odm.normalizer.backed_enum', '@?dunglas_doctrine_json_odm.normalizer.uid', '@dunglas_doctrine_json_odm.normalizer.datetime', '@dunglas_doctrine_json_odm.normalizer.array', '@dunglas_doctrine_json_odm.normalizer.object' ]
      - [ '@serializer.encoder.json' ]
      - '@?dunglas_doctrine_json_odm.type_mapper'
    public: true
    autowire: false
    autoconfigure: false

  DirectoryTree\ImapEngine\MailboxInterface:
    class: DirectoryTree\ImapEngine\Mailbox
    arguments:
      $config:
        port: 993
        ssl: true
        username: '%env(MAILBOX_USERNAME)%'
        password: '%env(MAILBOX_PASSWORD)%'
        host: '%env(MAILBOX_HOST)%'
    public: true

  logdash:
    class: Logdash\Logdash
    factory: [ 'Logdash\Logdash', 'create' ]
    arguments:
      - apiKey: '%env(LOGDASH_API_KEY)%'
        verbose: '%kernel.debug%'

  Logdash\Logger\Logger:
    factory: [ '@logdash', 'logger' ]
    public: true

  Symfony\Component\Cache\Psr16Cache:

  Psr\SimpleCache\CacheInterface:
    alias: Symfony\Component\Cache\Psr16Cache

  SymfonyHealthCheckBundle\Check\DoctrineORMCheck:
    alias: symfony_health_check.doctrine_orm_check

  # Scanner honeypot (mleczakm/zip-bomb-honeypot, not covered by the App\ autodiscovery above)
  Mleczakm\ZipBombHoneypot\MaliciousRequestSubscriber: ~
  Mleczakm\ZipBombHoneypot\HoneypotResponder: ~
  Mleczakm\ZipBombHoneypot\MaliciousRequestPathMatcher: ~
  Mleczakm\ZipBombHoneypot\ZipBombGenerator: ~

  # Monolog → Sentry: use the bundle HubInterface (with bindClient), do not override it.
  BGalati\MonologSentryHandler\SentryHandler:
    arguments:
      $hub: '@Sentry\State\HubInterface'
  Sentry\Integration\RequestIntegration:
  Sentry\Integration\EnvironmentIntegration:
  Sentry\Integration\FrameContextifierIntegration:
  Sentry\Integration\RequestFetcherInterface:
    class: Sentry\Integration\RequestFetcher

  Symfony\Contracts\Service\ResetInterface:
    alias: services_resetter

  # readonly resettable services can't be proxified for coroutine pooling; they hold no
  # per-request state so mark them safe to share as-is.
  App\Infrastructure\Doctrine\EntityManagerResetter:
    arguments:
      $env: '%kernel.environment%'
    public: true
    tags:
      - { name: swoole_bundle.safe_stateful_service }

  App\Infrastructure\ImapEngine\ConnectionCloserOnResetSubscriber:
    public: true
    tags:
      - { name: swoole_bundle.safe_stateful_service }

  App\Infrastructure\Swoole\CurrentWorkerRestarterInterface:
    alias: App\Infrastructure\Swoole\SwooleCurrentWorkerRestarter

  App\Infrastructure\Swoole\SwooleServerProviderInterface:
    alias: App\Infrastructure\Swoole\HttpServerSwooleServerProvider

  # Task-handler decorator chain (higher decoration_priority = outer):
  #   ExceptionLoggingTaskHandler -> TaskWorkerConnectionEnsuringHandler -> real handler
  # so a dead Doctrine connection surfaces as a logged error instead of crashing the worker.
  App\Infrastructure\Swoole\ExceptionLoggingTaskHandler:
    decorates: SwooleBundle\SwooleBundle\Server\TaskHandler\TaskHandler
    decoration_priority: -9995

  App\Infrastructure\Swoole\TaskWorkerConnectionEnsuringHandler:
    decorates: SwooleBundle\SwooleBundle\Server\TaskHandler\TaskHandler
    decoration_priority: -9996
    arguments:
      $innerHandler: '@.inner'

  Symfony\Component\HttpFoundation\Session\Storage\Handler\PdoSessionHandler:
    arguments:
      - '%env(DATABASE_URL)%'
      - { db_table: 'classycash.sessions' }

  App\Infrastructure\Twig\MoneyExtension:
    tags: [ 'twig.extension' ]

  # Global application settings
  App\Settings\Settings:
    public: true

  # Class Council Twig helpers
  App\Infrastructure\Symfony\Twig\ClassCouncilExtension:
    tags: [ 'twig.extension' ]

  # Gedmo SoftDeleteable listener
  Gedmo\SoftDeleteable\SoftDeleteableListener:
    tags:
      - { name: 'doctrine.event_listener', event: 'onFlush' }
      - { name: 'doctrine.event_listener', event: 'loadClassMetadata' }

  cache.adapter.doctrine:
    parent: cache.adapter.doctrine_dbal
    arguments:
      $connOrDsn: '@database_connection'
      $options:
        # CRUCIAL: Forces the explicit schema mapping prefix
        db_table: 'classycash.cache_items'

# SentryBundle is prod-only (config/bundles.php), so dev/test have no real, DSN-bound Hub.
# The coroutine proxifier eagerly wraps SentryHandler and needs its $hub resolvable, so fall
# back to the bare SDK singleton here - it never gets a client bound, so captures are no-ops.
when@dev:
  services:
    Sentry\State\HubInterface:
      factory: ['Sentry\SentrySdk', 'getCurrentHub']

when@test:
  services:
    _defaults:
      autowire: true
      autoconfigure: true

    Sentry\State\HubInterface:
      factory: ['Sentry\SentrySdk', 'getCurrentHub']

    # The real Swoole task-worker constraint this guards against does not exist under
    # PHPUnit, and some tests deliberately route nested commands to the fake transport.
    App\Infrastructure\Messenger\PreventAsyncDispatchInTaskWorkerMiddleware:
      arguments:
        $enabled: false
