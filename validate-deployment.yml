#!/bin/bash

# Validation script for Classy-Cash deployment configuration
# This script validates the Ansible configuration without attempting to connect

echo "🧪 Validating Classy-Cash deployment configuration..."

cd "$(dirname "$0")"

echo "📋 Checking playbook syntax..."
if command -v ansible-playbook &> /dev/null; then
    ansible-playbook ansible/playbooks/deploy.yml --syntax-check
    if [ $? -eq 0 ]; then
        echo "✅ Playbook syntax is valid"
    else
        echo "❌ Playbook syntax check failed"
        exit 1
    fi
else
    echo "⚠️  Ansible not installed, skipping syntax check"
fi

echo "📋 Checking configuration files..."
if [ -f "ansible/playbooks/config.yml" ]; then
    echo "✅ Configuration file exists"
else
    echo "❌ Configuration file missing"
    exit 1
fi

if [ -f "ansible/inventory.ini" ]; then
    echo "✅ Inventory file exists"
else
    echo "❌ Inventory file missing"
    exit 1
fi

if [ -f "ansible.cfg" ]; then
    echo "✅ Ansible configuration file exists"
else
    echo "❌ Ansible configuration file missing"
    exit 1
fi

echo "📋 Validating YAML configuration..."
if command -v python3 &> /dev/null; then
    python3 -c "
import yaml
import sys

try:
    with open('ansible/playbooks/config.yml', 'r') as f:
        config = yaml.safe_load(f)
    
    if 'apps' in config and len(config['apps']) > 0:
        app = config['apps'][0]
        required_fields = ['name', 'domain', 'port', 'image']
        for field in required_fields:
            if field not in app:
                print(f'❌ Missing required field: {field}')
                sys.exit(1)
        print('✅ Configuration YAML is valid')
        print(f'   - App: {app[\"name\"]}')
        print(f'   - Domain: {app[\"domain\"]}')
        print(f'   - Port: {app[\"port\"]}')
        print(f'   - Image: {app[\"image\"]}')
    else:
        print('❌ No apps found in configuration')
        sys.exit(1)
        
except Exception as e:
    print(f'❌ YAML validation failed: {e}')
    sys.exit(1)
"
else
    echo "⚠️  Python3 not available, skipping YAML validation"
fi

echo "🎉 All validations passed! The Classy-Cash deployment configuration is ready."
