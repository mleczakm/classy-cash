---
- name: Deploy Classy-Cash Application
  hosts: mikrus
  become: yes
  vars_files:
    - config.yml
  tasks:
    - name: Deploy classy-cash app
      include_role:
        name: app_deploy
      loop: "{{ apps }}"
      loop_control:
        loop_var: app
      vars:
        # These should be passed via --extra-vars or env
        cytrus_srv: "{{ cytrus_srv | default('') }}"
        cytrus_api_token: "{{ cytrus_api_token | default('') }}"
        cloudflare_api_token: "{{ cloudflare_api_token | default('') }}"
        cloudflare_zone_id: "{{ cloudflare_zone_id | default('') }}"
        mikrus_ipv6: "{{ mikrus_ipv6 | default('') }}"
