deptrac:
    paths:
        - ./src
    exclude_files:
        - '#/Kernel\.php#'
    layers:
        # The innermost layer: framework-agnostic logic with no dependency on
        # anything else in src/.
        - name: Domain
          collectors:
              - type: directory
                value: src/Domain/.*
        - name: Entity
          collectors:
              - type: directory
                value: src/Entity/.*
        # Message DTOs dispatched on the Messenger bus (see messenger.yaml
        # routing). Kept separate from Console, which lives in the same
        # src/Application/Command directory but holds Symfony CLI commands,
        # not bus messages.
        - name: Message
          collectors:
              - type: directory
                value: 'src/Application/Command/(?!Console/).*'
        - name: Console
          collectors:
              - type: directory
                value: src/Application/Command/Console/.*
        - name: MessageHandler
          collectors:
              - type: directory
                value: src/Application/CommandHandler/.*
        # Use cases, application services, and ports.
        - name: Application
          collectors:
              - type: directory
                value: src/Application/Service/.*
        # Plain data classes bound to Symfony forms (data_class). Kept separate
        # from Form so Application can map to/from them without depending on
        # the form-building layer itself.
        - name: FormModel
          collectors:
              - type: directory
                value: src/Form/Model/.*
        - name: Form
          collectors:
              - type: directory
                value: 'src/Form/(?!Model/).*'
        - name: Repository
          collectors:
              - type: directory
                value: src/Repository/.*
        # Adapters: Doctrine, Swoole, Sentry, Twig extensions, IMAP, feature
        # flags, auth, and app settings storage.
        - name: Infrastructure
          collectors:
              - type: directory
                value: src/Infrastructure/.*
              - type: directory
                value: src/Security/.*
              - type: directory
                value: src/Settings/.*
              - type: directory
                value: src/FeatureFlag/.*
        # Controllers, LiveComponents. The entry point, so it may reach
        # Infrastructure directly for things not yet behind an Application port.
        - name: UserInterface
          collectors:
              - type: directory
                value: src/UserInterface/.*
    ruleset:
        Domain: []
        # Entity's Repository use is only Doctrine's
        # `#[ORM\Entity(repositoryClass: ...)]` attribute, which references the
        # repository by class-string, not a real runtime dependency.
        Entity:
            - Domain
            - Repository
        Message:
            - Domain
            - Entity
        FormModel:
            - Domain
            - Entity
        Console:
            - Domain
            - Entity
            - Message
            - MessageHandler
            - Application
            - Repository
            - Infrastructure
        MessageHandler:
            - Domain
            - Entity
            - Message
            - Application
            - Repository
            - Infrastructure
        Application:
            - Domain
            - Entity
            - Message
            - FormModel
            - Repository
            - Infrastructure
        Form:
            - Domain
            - Entity
            - FormModel
            - Application
            - Infrastructure
        # Repository's Entity dependency is only Doctrine's
        # `#[ORM\Entity(repositoryClass: ...)]` counterpart: hydrating and
        # querying the entity it's the repository for.
        Repository:
            - Domain
            - Entity
            - Infrastructure
        Infrastructure:
            - Domain
            - Entity
            - Message
            - Application
            - Repository
        UserInterface:
            - Domain
            - Entity
            - Message
            - MessageHandler
            - Application
            - FormModel
            - Form
            - Repository
            - Infrastructure
